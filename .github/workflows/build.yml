name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext autopoint curl wget patch build-essential liblzma-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Python build tools
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v6-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-v6-${{ runner.os }}-

      - name: Remove stale python-for-android
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

      - name: Prepare python-for-android
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"
          cd "$P4A_DIR"
          git describe --tags --always || true

      - name: Patch python3 recipe
        shell: bash
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"
          PATCHFILE=/tmp/ee_patch.py

          # Write the patch helper to a temp file, one line per printf,
          # so no YAML indentation is preserved into the file.
          : > "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' '# EE Inspector Pro Android compatibility patch' >> "$PATCHFILE"
          printf '%s\n' '_ee_original_prebuild_arch = Python3Recipe.prebuild_arch' >> "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' 'def _ee_patched_prebuild_arch(self, arch):' >> "$PATCHFILE"
          printf '%s\n' '    result = _ee_original_prebuild_arch(self, arch)' >> "$PATCHFILE"
          printf '%s\n' '    import os' >> "$PATCHFILE"
          printf '%s\n' '    from pathlib import Path' >> "$PATCHFILE"
          printf '%s\n' '    build_dir = self.get_build_dir(arch.arch)' >> "$PATCHFILE"
          printf '%s\n' '    grp_file = Path(build_dir) / "Modules" / "grpmodule.c"' >> "$PATCHFILE"
          printf '%s\n' '    if grp_file.is_file():' >> "$PATCHFILE"
          printf '%s\n' '        src = grp_file.read_text()' >> "$PATCHFILE"
          printf '%s\n' '        marker = "grp_getgrall_impl(PyObject *module)"' >> "$PATCHFILE"
          printf '%s\n' '        idx = src.find(marker)' >> "$PATCHFILE"
          printf '%s\n' '        if idx >= 0:' >> "$PATCHFILE"
          printf '%s\n' '            brace = src.find("{", idx)' >> "$PATCHFILE"
          printf '%s\n' '            if brace >= 0:' >> "$PATCHFILE"
          printf '%s\n' '                depth = 0' >> "$PATCHFILE"
          printf '%s\n' '                end = -1' >> "$PATCHFILE"
          printf '%s\n' '                for i in range(brace, len(src)):' >> "$PATCHFILE"
          printf '%s\n' '                    c = src[i]' >> "$PATCHFILE"
          printf '%s\n' '                    if c == "{":' >> "$PATCHFILE"
          printf '%s\n' '                        depth += 1' >> "$PATCHFILE"
          printf '%s\n' '                    elif c == "}":' >> "$PATCHFILE"
          printf '%s\n' '                        depth -= 1' >> "$PATCHFILE"
          printf '%s\n' '                        if depth == 0:' >> "$PATCHFILE"
          printf '%s\n' '                            end = i + 1' >> "$PATCHFILE"
          printf '%s\n' '                            break' >> "$PATCHFILE"
          printf '%s\n' '                if end > 0:' >> "$PATCHFILE"
          printf '%s\n' '                    replacement = (' >> "$PATCHFILE"
          printf '%s\n' '                        "grp_getgrall_impl(PyObject *module)\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "{\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "    PyObject *d = PyDict_New();\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "    if (d == NULL)\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "        return NULL;\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "    return d;\n"' >> "$PATCHFILE"
          printf '%s\n' '                        "}"' >> "$PATCHFILE"
          printf '%s\n' '                    )' >> "$PATCHFILE"
          printf '%s\n' '                    src = src[:idx] + replacement + src[end:]' >> "$PATCHFILE"
          printf '%s\n' '                    grp_file.write_text(src)' >> "$PATCHFILE"
          printf '%s\n' '                    print("EE Inspector Pro: patched grpmodule.c")' >> "$PATCHFILE"
          printf '%s\n' '    setup = Path(build_dir) / "Modules" / "Setup"' >> "$PATCHFILE"
          printf '%s\n' '    if setup.is_file():' >> "$PATCHFILE"
          printf '%s\n' '        text = setup.read_text()' >> "$PATCHFILE"
          printf '%s\n' '        text = text.replace("readline readline.c", "*disabled*")' >> "$PATCHFILE"
          printf '%s\n' '        text = text.replace("lzma lzma.c", "*disabled*")' >> "$PATCHFILE"
          printf '%s\n' '        setup.write_text(text)' >> "$PATCHFILE"
          printf '%s\n' '        print("EE Inspector Pro: disabled readline and lzma modules")' >> "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' '' >> "$PATCHFILE"
          printf '%s\n' 'Python3Recipe.prebuild_arch = _ee_patched_prebuild_arch' >> "$PATCHFILE"

          # Append helper to the recipe
          cat "$PATCHFILE" >> "$RECIPE"

          # Syntax check
          python -m py_compile "$RECIPE"
          echo "OK: recipe compiles."

          # Show the tail
          echo "===== last 20 lines of recipe ====="
          tail -n 20 "$RECIPE"

      - name: Verify build configuration
        shell: bash
        run: |
          set -e
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' buildozer.spec || true
          find recipes -maxdepth 3 -type f -print | sort
          test -f .github/workflows/build.yml
          echo "OK: .github/workflows/build.yml exists."

      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
