name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext autopoint curl wget patch build-essential \liblzma-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Python build tools
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v12-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-v12-${{ runner.os }}-

      - name: Remove stale python-for-android
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

      - name: Verify build configuration
        shell: bash
        run: |
          set -e
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' buildozer.spec || true
          find recipes -maxdepth 3 -type f -print | sort
          test -f .github/workflows/build.yml
          echo "OK: .github/workflows/build.yml exists."
      
      - name: Show buildozer.spec
        run: |
          set -e
          echo "===== working dir ====="
          pwd
          echo "===== buildozer.spec location ====="
          ls -la buildozer.spec
          echo "===== p4a.local_recipes line ====="
          grep -n "local_recipes" buildozer.spec
          echo "===== recipes tree ====="
          find recipes -maxdepth 3 -type f -print 2>/dev/null || echo "recipes/ not found"  
                
      - name: Set absolute local recipes path
        run: |
          set -e
          echo "P4A_LOCAL_RECIPES=$GITHUB_WORKSPACE/recipes" >> "$GITHUB_ENV"
          echo "Set P4A_LOCAL_RECIPES to $GITHUB_WORKSPACE/recipes"

      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          sed -i "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" buildozer.spec
          grep "p4a.local_recipes" buildozer.spec || true
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
