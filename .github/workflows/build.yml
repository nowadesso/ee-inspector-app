name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install autotools
        run: |
          set -e
          apt-get update
          apt-get install -y autopoint gettext autoconf automake libtool
          which autopoint

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-py311-sdl2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-py311-sdl2-${{ runner.os }}-

      - name: Wrap cmake to inject CMAKE_POLICY_VERSION_MINIMUM
        run: |
          set -e
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexec /usr/bin/cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "$@"\n' > /usr/local/bin/cmake
          chmod +x /usr/local/bin/cmake
          which cmake
          cmake --version | head -1
                
      - name: Install setuptools into host python
        run: |
          set -e
          HOSTPYTHON="/__w/ee-inspector-app/ee-inspector-app/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/python3"
          if [ -x "$HOSTPYTHON" ]; then
            echo "Found hostpython at $HOSTPYTHON"
            "$HOSTPYTHON" -m pip install --upgrade setuptools || true
            "$HOSTPYTHON" -c "import setuptools; import distutils; print('setuptools OK')" || echo "setuptools import failed"
          else
            echo "hostpython not found at $HOSTPYTHON"
          fi

      - name: Build APK
        run: |
          set -e
          sed -i "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" buildozer.spec
          grep "p4a.local_recipes" buildozer.spec
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
