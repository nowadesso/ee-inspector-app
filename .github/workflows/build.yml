name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-sdl2-mirror-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-sdl2-mirror-${{ runner.os }}-

      - name: Pre-download SDL2
        run: |
          set -e
          PACKAGES_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/sdl2"
          mkdir -p "$PACKAGES_DIR"
          cd "$PACKAGES_DIR"
          wget -q "http://mirror.koddos.net/blfs/conglomeration/SDL/SDL2-2.28.5.tar.gz" -O SDL2-2.28.5.tar.gz
          ls -la
          echo "SDL2 pre-downloaded successfully"
          
      - name: Build APK
        run: |
          set -e
          sed -i "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" buildozer.spec
          grep "p4a.local_recipes" buildozer.spec
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
