name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest
      options: --user root

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java 17 and autotools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            openjdk-17-jdk \
            autopoint \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            patch \
            unzip \
            zip \
            wget \
            curl \
            git

          echo "===== Java version ====="

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          java -version

          echo "JAVA_HOME=$JAVA_HOME"

          which java


      - name: Verify Python and Buildozer
        shell: bash
        run: |
          set -e

          echo "===== Python ====="
          python --version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Java ====="
          java -version


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-ee-inspector-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            buildozer-ee-inspector-${{ runner.os }}-


      - name: Check local recipes
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Local recipe structure"
          echo "=========================================="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo
          echo "=========================================="
          echo " Checking required recipes"
          echo "=========================================="

          test -d recipes/opencv
          test -d recipes/opencv_extras
          test -d recipes/python3

          echo "OK: recipes/opencv exists"
          echo "OK: recipes/opencv_extras exists"
          echo "OK: recipes/python3 exists"

          if [ -f recipes/python3/__init__.py ]; then
            echo "ERROR: recipes/python3/__init__.py exists."
            echo "The local Python recipe must use the p4a recipe mechanism correctly."
          else
            echo "Checking Python recipe directory..."
          fi


      - name: Verify buildozer.spec
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " buildozer.spec"
          echo "=========================================="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.local_recipes)' \
            buildozer.spec || true

          echo
          echo "=========================================="
          echo " OpenCV requirements"
          echo "=========================================="

          grep -q "opencv" buildozer.spec
          grep -q "opencv_extras" buildozer.spec

          echo "OK: OpenCV requirement found."
          echo "OK: OpenCV extras requirement found."


      - name: Configure local recipes
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Configuring p4a local recipes"
          echo "=========================================="

          sed -i \
            "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" \
            buildozer.spec

          echo
          echo "p4a.local_recipes:"
          grep "^p4a.local_recipes" buildozer.spec


      - name: Clean old Android build
        shell: bash
        run: |
          set -e

          echo "Cleaning stale Android build directories..."

          rm -rf .buildozer/android/platform/python-for-android || true

          echo "Old python-for-android checkout removed."


      - name: Build APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "=========================================="
          echo " Starting Buildozer Android build"
          echo "=========================================="

          echo
          echo "===== Java ====="
          java -version

          echo
          echo "===== JAVA_HOME ====="
          echo "$JAVA_HOME"

          echo
          echo "===== Buildozer configuration ====="
          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.local_recipes)' \
            buildozer.spec || true

          echo
          echo "===== Starting Buildozer ====="

          echo "y" | buildozer -v android debug


      - name: Show build output
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " bin directory"
          echo "=========================================="

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory does not exist."
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
