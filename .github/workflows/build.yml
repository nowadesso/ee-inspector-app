name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev lld libltdl-dev gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "buildozer" "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-v3-${{ hashFiles('buildozer.spec', 'recipes/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v3-

      - name: Clean stale build state
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a_*
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build/dists
          mkdir -p bin

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android clean
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
