name: Build EE Inspector Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout project
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # 3. Install Ubuntu build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential


      # ---------------------------------------------------------
      # 4. Install Buildozer / Cython
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            "cython<3.4"


      # ---------------------------------------------------------
      # 5. Cache Buildozer files
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ---------------------------------------------------------
      # 6. Remove stale python-for-android
      # ---------------------------------------------------------
      - name: Remove stale python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"


      # ---------------------------------------------------------
      # 7. Clone known python-for-android version
      # ---------------------------------------------------------
      - name: Prepare python-for-android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          echo "===== python-for-android version ====="

          cd "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          git describe --tags --always || true


      # ---------------------------------------------------------
      # 8. Prepare official Python recipe
      #
      # IMPORTANT:
      # We DO NOT replace the official p4a python3 recipe.
      #
      # We also DO NOT use disable_grp.patch.
      #
      # Instead, we inject a small source modification directly
      # into the official recipe's build_arch() function.
      # ---------------------------------------------------------
      - name: Prepare Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"
          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"

          echo "===== Paths ====="
          echo "P4A_DIR=$P4A_DIR"
          echo "LOCAL_PYTHON_RECIPE=$LOCAL_PYTHON_RECIPE"
          echo "P4A_PYTHON_RECIPE=$P4A_PYTHON_RECIPE"


          # -------------------------------------------------------
          # Verify official p4a Python recipe exists
          # -------------------------------------------------------
          echo
          echo "===== Checking official Python recipe ====="

          test -f "$P4A_PYTHON_RECIPE/__init__.py"

          echo "OK: official Python recipe found."


          # -------------------------------------------------------
          # Make sure local python3 recipe directory exists
          # -------------------------------------------------------
          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"


          # -------------------------------------------------------
          # IMPORTANT:
          # Delete any local python3/__init__.py.
          #
          # The official p4a recipe must remain in control.
          # -------------------------------------------------------
          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "Removing local recipes/python3/__init__.py"
            rm -f "$LOCAL_PYTHON_RECIPE/__init__.py"
          fi

          echo "OK: local recipes/python3/__init__.py is absent."


          # -------------------------------------------------------
          # Copy official p4a Python patches to local recipe area.
          #
          # This keeps the official Python patches available to
          # the local recipe system.
          # -------------------------------------------------------
          echo
          echo "===== Copying official Python patches ====="

          cp \
            "$P4A_PYTHON_RECIPE/patches/"* \
            "$LOCAL_PYTHON_RECIPE/patches/"

          echo "Official Python patches copied."


          # -------------------------------------------------------
          # IMPORTANT:
          # Remove the old disable_grp.patch if it exists.
          #
          # We are NOT using a patch file for grp anymore.
          # -------------------------------------------------------
          echo
          echo "===== Removing old grp patch ====="

          rm -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          rm -f \
            "$P4A_PYTHON_RECIPE/patches/disable_grp.patch"

          echo "OK: old disable_grp.patch removed."


          # -------------------------------------------------------
          # Inject direct grpmodule.c fix into official p4a recipe.
          # -------------------------------------------------------
          echo
          echo "===== Installing ANDROID_GRP_FIX ====="

          python - <<'PY'
          from pathlib import Path

          recipe = Path(
              ".buildozer/android/platform/python-for-android/"
              "pythonforandroid/recipes/python3/__init__.py"
          )

          text = recipe.read_text(encoding="utf-8")


          # This is the exact point in the official p4a recipe
          # where the CPython recipe build directory is obtained.
          marker = """        recipe_build_dir = self.get_build_dir(arch.arch)
          """


          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find the expected "
                  "'recipe_build_dir = self.get_build_dir(arch.arch)' "
                  "line in the official p4a Python recipe."
              )


          # Do not inject the fix twice.
          if "ANDROID_GRP_FIX" in text:
              print("ANDROID_GRP_FIX already exists.")
              raise SystemExit(0)


          insertion = """        # ---------------------------------------------------------
          # ANDROID_GRP_FIX
          #
          # Android does not provide setgrent/getgrent/endgrent.
          # CPython 3.12.10's grp.getgrall() uses those functions.
          #
          # Modify Modules/grpmodule.c immediately before CPython
          # compilation.
          # ---------------------------------------------------------

          grp_file = join(
              recipe_build_dir,
              'Modules',
              'grpmodule.c'
          )

          if not exists(grp_file):
              raise RuntimeError(
                  'ANDROID_GRP_FIX: Modules/grpmodule.c was not found: '
                  + grp_file
              )

          with open(grp_file, 'r', encoding='utf-8') as f:
              grp_source = f.read()

          grp_start = grp_source.find(
              '    setgrent();'
          )

          grp_end = grp_source.find(
              '    return d;',
              grp_start
          )

          if grp_start == -1:
              raise RuntimeError(
                  'ANDROID_GRP_FIX: setgrent() was not found.'
              )

          if grp_end == -1:
              raise RuntimeError(
                  'ANDROID_GRP_FIX: return d; after setgrent() '
                  'was not found.'
              )

          # Keep "return d;" but remove everything before it,
          # including both endgrent() calls.
          grp_source = (
              grp_source[:grp_start]
              + '    return d;'
              + grp_source[grp_end + len('    return d;'):]
          )

          with open(grp_file, 'w', encoding='utf-8') as f:
              f.write(grp_source)

          # ---------------------------------------------------------
          # Verify forbidden Android-incompatible functions
          # are completely gone.
          # ---------------------------------------------------------
          with open(grp_file, 'r', encoding='utf-8') as f:
              verify_source = f.read()

          for forbidden in (
              'setgrent();',
              'getgrent();',
              'endgrent();',
          ):
              if forbidden in verify_source:
                  raise RuntimeError(
                      'ANDROID_GRP_FIX: '
                      + forbidden
                      + ' still exists in grpmodule.c'
                  )

          print(
              'ANDROID_GRP_FIX: Successfully removed '
              'setgrent/getgrent/endgrent.'
          )

          """


          text = text.replace(
              marker,
              marker + insertion,
              1
          )


          recipe.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "ANDROID_GRP_FIX successfully injected into "
              "official p4a Python recipe."
          )
          PY


          # -------------------------------------------------------
          # Verify injection
          # -------------------------------------------------------
          echo
          echo "===== Verify ANDROID_GRP_FIX ====="

          grep -n \
            "ANDROID_GRP_FIX" \
            "$P4A_PYTHON_RECIPE/__init__.py"

          echo
          echo "===== Verify build_arch area ====="

          grep -n -A90 -B10 \
            "ANDROID_GRP_FIX" \
            "$P4A_PYTHON_RECIPE/__init__.py" | head -120


      # ---------------------------------------------------------
      # 9. Verify local recipes
      # ---------------------------------------------------------
      - name: Verify local recipes
        shell: bash
        run: |
          set -e

          echo "===== Local recipes ====="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort


          echo
          echo "===== Verify local python3 recipe ====="

          if [ -f "recipes/python3/__init__.py" ]; then
            echo "ERROR: recipes/python3/__init__.py must NOT exist."
            exit 1
          fi

          echo "OK: recipes/python3/__init__.py is absent."


          echo
          echo "===== Verify old grp patch is absent ====="

          if [ -f "recipes/python3/patches/disable_grp.patch" ]; then
            echo "ERROR: disable_grp.patch must NOT exist."
            exit 1
          fi

          echo "OK: disable_grp.patch is absent."


          echo
          echo "===== Verify official Python patches ====="

          test -f \
            "recipes/python3/patches/py3.8.1_fix_cortex_a8.patch"

          test -f \
            "recipes/python3/patches/py3.8.1.patch"

          test -f \
            "recipes/python3/patches/pyconfig_detection.patch"

          echo "OK: required official Python patches exist."


      # ---------------------------------------------------------
      # 10. Verify Buildozer configuration
      # ---------------------------------------------------------
      - name: Show Buildozer configuration
        shell: bash
        run: |
          echo "===== buildozer.spec ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' \
            buildozer.spec || true


          echo
          echo "===== Local recipes ====="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort


      # ---------------------------------------------------------
      # 11. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"

        run: |
          set -e

          echo "=========================================="
          echo "Starting Buildozer Android build"
          echo "=========================================="

          buildozer -v android debug


      # ---------------------------------------------------------
      # 12. Show APK files
      # ---------------------------------------------------------
      - name: Check APK output
        shell: bash
        run: |
          echo "===== APK files ====="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
