name: Build EE Inspector Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout project
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Set up host Python
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # 3. Install Ubuntu build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential


      # ---------------------------------------------------------
      # 4. Install Buildozer / Cython
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            "cython<3.4"


      # ---------------------------------------------------------
      # 5. Cache Buildozer files
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ---------------------------------------------------------
      # 6. Remove stale python-for-android checkout
      # ---------------------------------------------------------
      - name: Remove stale python-for-android
        run: |
          set -e

          rm -rf \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"


      # ---------------------------------------------------------
      # 7. Clone known python-for-android version
      # ---------------------------------------------------------
      - name: Prepare python-for-android
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          echo
          echo "===== python-for-android version ====="

          cd "$P4A_DIR"

          git describe --tags --always || true


      # ---------------------------------------------------------
      # 8. Prepare official Python recipe
      #
      # IMPORTANT:
      # We DO NOT use disable_grp.patch anymore.
      #
      # We keep the official p4a Python recipe untouched except
      # for one small helper which removes the Android-incompatible
      # setgrent/getgrent/endgrent block immediately before CPython
      # compilation.
      # ---------------------------------------------------------
      - name: Prepare Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"
          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          echo "===== P4A directory ====="
          echo "$P4A_DIR"

          echo
          echo "===== Official Python recipe ====="
          echo "$P4A_PYTHON_RECIPE"

          test -f "$P4A_PYTHON_RECIPE/__init__.py"

          echo "OK: official Python recipe exists."


          # -----------------------------------------------------
          # Make sure we never use the old custom grp patch
          # -----------------------------------------------------

          echo
          echo "===== Removing old disable_grp.patch from local recipe ====="

          rm -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          rm -f \
            "$P4A_PYTHON_RECIPE/patches/disable_grp.patch"


          # -----------------------------------------------------
          # Make sure local python3 recipe has NO __init__.py
          # -----------------------------------------------------

          echo
          echo "===== Checking local python3 recipe ====="

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "ERROR:"
            echo "recipes/python3/__init__.py must NOT exist."
            exit 1
          fi

          echo "OK: local recipes/python3/__init__.py is absent."


          # -----------------------------------------------------
          # Copy official p4a patches into local recipe directory
          # -----------------------------------------------------

          echo
          echo "===== Copying official Python patches ====="

          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"

          cp \
            "$P4A_PYTHON_RECIPE/patches/"* \
            "$LOCAL_PYTHON_RECIPE/patches/"


          # -----------------------------------------------------
          # Inject a SAFE helper into the official recipe.
          #
          # The helper is inserted at module level, BEFORE the
          # Python3Recipe class.
          #
          # Then only ONE properly-indented line is inserted into
          # build_arch().
          #
          # This avoids the indentation problem from Run #93.
          # -----------------------------------------------------

          echo
          echo "===== Installing safe CPython grp source fixer ====="

          python - <<'PY'
          from pathlib import Path

          recipe = Path(
              ".buildozer/android/platform/python-for-android/"
              "pythonforandroid/recipes/python3/__init__.py"
          )

          text = recipe.read_text()

          helper = r'''
          def _fix_android_grp_source(recipe_build_dir):
              """Remove unsupported POSIX group enumeration APIs from CPython."""

              from pathlib import Path

              grp_file = Path(recipe_build_dir) / "Modules" / "grpmodule.c"

              if not grp_file.is_file():
                  raise RuntimeError(
                      f"Could not find CPython grp source: {grp_file}"
                  )

              source = grp_file.read_text()

              # If already fixed, do nothing.
              if "setgrent();" not in source:
                  print("Android grp source already fixed.")
                  return

              start = source.find("    setgrent();")

              if start < 0:
                  raise RuntimeError(
                      "Found grp source, but could not find setgrent()."
                  )

              return_marker = "    return d;"
              end = source.find(return_marker, start)

              if end < 0:
                  raise RuntimeError(
                      "Could not find return d; after setgrent()."
                  )

              replacement = source[:start] + source[end:]

              # Verify all problematic APIs disappeared.
              for name in (
                  "setgrent();",
                  "getgrent();",
                  "endgrent();",
              ):
                  if name in replacement:
                      raise RuntimeError(
                          f"grp fix failed: {name} is still present."
                      )

              grp_file.write_text(replacement)

              print(
                  "SUCCESS: removed setgrent/getgrent/endgrent "
                  "from Modules/grpmodule.c"
              )
          '''

          class_marker = "class Python3Recipe(Recipe):"

          if class_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find Python3Recipe class."
              )

          if "_fix_android_grp_source" not in text:
              text = text.replace(
                  class_marker,
                  helper.strip() + "\n\n\n" + class_marker,
                  1
              )

          build_marker = (
              "        recipe_build_dir = "
              "self.get_build_dir(arch.arch)"
          )

          call_line = "        _fix_android_grp_source(recipe_build_dir)"

          if build_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find recipe_build_dir line."
              )

          if call_line not in text:
              text = text.replace(
                  build_marker,
                  build_marker + "\n" + call_line,
                  1
              )

          recipe.write_text(text)

          print("Safe CPython grp fixer installed.")
          PY


          # -----------------------------------------------------
          # Verify recipe syntax BEFORE Buildozer starts.
          # -----------------------------------------------------

          echo
          echo "===== Checking Python recipe syntax ====="

          python -m py_compile \
            "$P4A_PYTHON_RECIPE/__init__.py"

          echo "OK: python3 recipe syntax is valid."


          # -----------------------------------------------------
          # Show the modified build_arch section.
          # -----------------------------------------------------

          echo
          echo "===== Python recipe build_arch section ====="

          grep -n \
            -A25 \
            -B8 \
            "recipe_build_dir = self.get_build_dir" \
            "$P4A_PYTHON_RECIPE/__init__.py" || true


      # ---------------------------------------------------------
      # 9. Verify Buildozer configuration
      # ---------------------------------------------------------
      - name: Verify Buildozer configuration
        shell: bash
        run: |
          set -e

          echo "===== buildozer.spec ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' \
            buildozer.spec || true


          echo
          echo "===== Local recipes ====="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort


          echo
          echo "===== Checking important requirements ====="

          grep -q "opencv" buildozer.spec
          grep -q "opencv_extras" buildozer.spec

          echo "OK: OpenCV requirement present."
          echo "OK: OpenCV Contrib requirement present."


          echo
          echo "===== Checking Python recipe ====="

          if [ -f "recipes/python3/__init__.py" ]; then
            echo "ERROR: local recipes/python3/__init__.py exists."
            exit 1
          fi

          echo "OK: official p4a Python recipe will be used."


      # ---------------------------------------------------------
      # 10. Inspect the recipe BEFORE Buildozer
      # ---------------------------------------------------------
      - name: Inspect patched Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          echo "===== Python recipe version ====="

          grep -n \
            "version =" \
            "$PYTHON_RECIPE" | head -5


          echo
          echo "===== grp fixer ====="

          grep -n \
            -A50 \
            "_fix_android_grp_source" \
            "$PYTHON_RECIPE"


          echo
          echo "===== Recipe syntax check ====="

          python -m py_compile "$PYTHON_RECIPE"

          echo "OK: recipe compiles successfully."


      # ---------------------------------------------------------
      # 11. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "=========================================="
          echo " Starting Buildozer Android build"
          echo "=========================================="

          buildozer -v android debug


      # ---------------------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
