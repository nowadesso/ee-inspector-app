name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y \
            autopoint \
            gettext \
            autoconf \
            automake \
            libtool \
            patch \
            cmake \
            build-essential

          echo "===== Tool versions ====="
          python --version
          buildozer --version
          cmake --version | head -1
          java -version 2>&1 | head -3

      - name: Verify project files
        shell: bash
        run: |
          set -e
          echo "===== Project ====="
          pwd
          echo
          echo "===== buildozer.spec ====="
          test -f buildozer.spec
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.local_recipes)' buildozer.spec || true
          echo
          echo "===== Local recipes ====="
          find recipes -maxdepth 3 -type f -print | sort
          echo
          echo "===== Checking important files ====="
          test -f main.py
          test -d recipes/opencv
          test -d recipes/opencv_extras
          test -f recipes/python3/__init__.py
          test -f recipes/sdl2/__init__.py
          test -f recipes/sdl2_ttf/__init__.py
          echo "OK: project files found."

      - name: Check Python recipe syntax
        shell: bash
        run: |
          set -e
          python -m py_compile recipes/python3/__init__.py
          python -m py_compile recipes/sdl2/__init__.py
          python -m py_compile recipes/sdl2_ttf/__init__.py
          echo "OK: local Python recipes compile."

      - name: Prepare Buildozer configuration
        shell: bash
        run: |
          set -e
          cp buildozer.spec buildozer.spec.original
          python - <<'PY'
          from pathlib import Path
          p = Path("buildozer.spec")
          text = p.read_text()
          lines = text.splitlines()
          output = []
          for line in lines:
              if line.strip().startswith("p4a.branch"):
                  continue
              if line.strip().startswith("p4a.local_recipes"):
                  continue
              output.append(line)
          output.append("p4a.local_recipes = %(source.dir)s/recipes")
          p.write_text("\n".join(output) + "\n")
          print("Updated p4a.local_recipes.")
          PY
          echo
          echo "===== Final p4a configuration ====="
          grep -E '^p4a\.(branch|local_recipes)' buildozer.spec || true

      - name: Clear incompatible cached build
        shell: bash
        run: |
          set -e
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf .buildozer/android/platform/python-for-android
          echo "Old Android build tree removed."

      - name: Build APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          echo "=========================================="
          echo " Starting EE Inspector Pro Android build"
          echo "=========================================="
          echo
          echo "===== Java ====="
          echo "$JAVA_HOME"
          java -version
          echo
          echo "===== Buildozer configuration ====="
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.local_recipes)' buildozer.spec
          echo
          echo "===== Starting Buildozer ====="
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
