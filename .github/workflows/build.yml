```yaml
name: Build EE Inspector Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout project
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Set up host Python
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # 3. Install Ubuntu build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential


      # ---------------------------------------------------------
      # 4. Set Java 17 for Gradle / Android build
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 5. Verify Java
      # ---------------------------------------------------------
      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "===== Java environment ====="
          echo "JAVA_HOME=$JAVA_HOME"

          echo
          echo "===== java ====="
          java -version

          echo
          echo "===== javac ====="
          javac -version


      # ---------------------------------------------------------
      # 6. Install Buildozer / Cython
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            "cython<3.4"


      # ---------------------------------------------------------
      # 7. Cache Buildozer files
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ---------------------------------------------------------
      # 8. Remove stale python-for-android checkout
      # ---------------------------------------------------------
      - name: Remove stale python-for-android
        run: |
          set -e

          rm -rf \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"


      # ---------------------------------------------------------
      # 9. Clone known python-for-android version
      # ---------------------------------------------------------
      - name: Prepare python-for-android
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          echo
          echo "===== python-for-android version ====="

          cd "$P4A_DIR"

          git describe --tags --always || true


      # ---------------------------------------------------------
      # 10. Prepare official Python recipe
      #
      # IMPORTANT:
      # We DO NOT use disable_grp.patch anymore.
      #
      # We keep the official p4a Python recipe untouched except
      # for one small helper which removes the Android-incompatible
      # setgrent/getgrent/endgrent block immediately before CPython
      # compilation.
      # ---------------------------------------------------------
      - name: Prepare Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"
          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          echo "===== P4A directory ====="
          echo "$P4A_DIR"

          echo
          echo "===== Official Python recipe ====="
          echo "$P4A_PYTHON_RECIPE"

          test -f "$P4A_PYTHON_RECIPE/__init__.py"

          echo "OK: official Python recipe exists."


          # -----------------------------------------------------
          # Remove old grp patch
          # -----------------------------------------------------

          echo
          echo "===== Removing old disable_grp.patch ====="

          rm -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          rm -f \
            "$P4A_PYTHON_RECIPE/patches/disable_grp.patch"


          # -----------------------------------------------------
          # Local recipe must NOT contain __init__.py
          # -----------------------------------------------------

          echo
          echo "===== Checking local python3 recipe ====="

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "ERROR: recipes/python3/__init__.py must NOT exist."
            exit 1
          fi

          echo "OK: local recipes/python3/__init__.py is absent."


          # -----------------------------------------------------
          # Copy official patches
          # -----------------------------------------------------

          echo
          echo "===== Copying official Python patches ====="

          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"

          cp \
            "$P4A_PYTHON_RECIPE/patches/"* \
            "$LOCAL_PYTHON_RECIPE/patches/"


          # -----------------------------------------------------
          # Show the exact recipe structure.
          # -----------------------------------------------------

          echo
          echo "===== Searching for recipe_build_dir ====="

          grep -n \
            "recipe_build_dir" \
            "$P4A_PYTHON_RECIPE/__init__.py" || true


          # -----------------------------------------------------
          # Install a module-level helper.
          #
          # We append the helper to the END of the Python recipe.
          # There is NO indentation here because it is module-level.
          # -----------------------------------------------------

          echo
          echo "===== Installing CPython grp fixer ====="

          cat >> "$P4A_PYTHON_RECIPE/__init__.py" <<'PYFIX'

# ---------------------------------------------------------
# EE Inspector Pro Android grp compatibility fix
# ---------------------------------------------------------

def _ee_inspector_fix_android_grp_source(recipe_build_dir):
    from pathlib import Path

    grp_file = (
        Path(recipe_build_dir)
        / "Modules"
        / "grpmodule.c"
    )

    if not grp_file.is_file():
        raise RuntimeError(
            f"CPython grp source not found: {grp_file}"
        )

    source = grp_file.read_text()

    if "setgrent();" not in source:
        print(
            "EE Inspector Pro: grp source already fixed."
        )
        return

    start = source.find("    setgrent();")

    if start < 0:
        raise RuntimeError(
            "Could not locate setgrent() in grpmodule.c"
        )

    end = source.find(
        "    return d;",
        start
    )

    if end < 0:
        raise RuntimeError(
            "Could not locate return d; in grpmodule.c"
        )

    source = source[:start] + source[end:]

    for name in (
        "setgrent();",
        "getgrent();",
        "endgrent();",
    ):
        if name in source:
            raise RuntimeError(
                f"grp fix failed: {name} still exists"
            )

    grp_file.write_text(source)

    print(
        "EE Inspector Pro: removed "
        "setgrent/getgrent/endgrent "
        "from Modules/grpmodule.c"
    )

PYFIX


          # -----------------------------------------------------
          # Find the build_arch recipe_build_dir line.
          #
          # Insert ONE call immediately after it.
          # -----------------------------------------------------

          echo
          echo "===== Adding grp fixer call ====="

          python - <<'PY'
from pathlib import Path

recipe = Path(
    ".buildozer/android/platform/python-for-android/"
    "pythonforandroid/recipes/python3/__init__.py"
)

text = recipe.read_text()

marker = (
    "        recipe_build_dir = "
    "self.get_build_dir(arch.arch)"
)

call = (
    "        "
    "_ee_inspector_fix_android_grp_source("
    "recipe_build_dir)"
)

if marker not in text:
    raise SystemExit(
        "ERROR: Could not find recipe_build_dir line."
    )

if call not in text:
    text = text.replace(
        marker,
        marker + "\n" + call,
        1
    )

recipe.write_text(text)

print("OK: grp fixer call inserted.")
PY


          # -----------------------------------------------------
          # VERY IMPORTANT:
          # Check Python syntax now.
          # -----------------------------------------------------

          echo
          echo "===== Checking Python recipe syntax ====="

          python -m py_compile \
            "$P4A_PYTHON_RECIPE/__init__.py"

          echo "OK: Python recipe syntax is valid."


          # -----------------------------------------------------
          # Show the relevant section.
          # -----------------------------------------------------

          echo
          echo "===== Relevant Python recipe section ====="

          grep -n \
            -A25 \
            -B8 \
            "recipe_build_dir" \
            "$P4A_PYTHON_RECIPE/__init__.py" || true


          echo
          echo "===== Grp fixer definition ====="

          grep -n \
            -A45 \
            "_ee_inspector_fix_android_grp_source" \
            "$P4A_PYTHON_RECIPE/__init__.py" || true


      # ---------------------------------------------------------
      # 11. Verify Buildozer configuration
      # ---------------------------------------------------------
      - name: Verify Buildozer configuration
        shell: bash
        run: |
          set -e

          echo "===== buildozer.spec ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' \
            buildozer.spec || true


          echo
          echo "===== Local recipes ====="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort


          echo
          echo "===== Checking important requirements ====="

          grep -q "opencv" buildozer.spec
          grep -q "opencv_extras" buildozer.spec

          echo "OK: OpenCV requirement present."
          echo "OK: OpenCV Contrib requirement present."


          echo
          echo "===== Checking Python recipe ====="

          if [ -f "recipes/python3/__init__.py" ]; then
            echo "ERROR: local recipes/python3/__init__.py exists."
            exit 1
          fi

          echo "OK: official p4a Python recipe will be used."


      # ---------------------------------------------------------
      # 12. Inspect the recipe BEFORE Buildozer
      # ---------------------------------------------------------
      - name: Inspect patched Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          echo "===== Python recipe version ====="

          grep -n \
            "version =" \
            "$PYTHON_RECIPE" | head -5


          echo
          echo "===== grp fixer ====="

          grep -n \
            -A50 \
            "_fix_android_grp_source" \
            "$PYTHON_RECIPE"


          echo
          echo "===== Recipe syntax check ====="

          python -m py_compile "$PYTHON_RECIPE"

          echo "OK: recipe compiles successfully."


      # ---------------------------------------------------------
      # 13. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "=========================================="
          echo " Starting Buildozer Android build"
          echo "=========================================="

          buildozer -v android debug


      # ---------------------------------------------------------
      # 14. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
