name: Build EE Inspector Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout project
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # 3. Install Ubuntu build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential


      # ---------------------------------------------------------
      # 4. Install Buildozer / Cython
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            "cython<3.4"


      # ---------------------------------------------------------
      # 5. Cache Buildozer files
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ---------------------------------------------------------
      # 6. Remove any stale python-for-android checkout
      # ---------------------------------------------------------
      - name: Remove stale python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"


      # ---------------------------------------------------------
      # 7. Clone known python-for-android version
      # ---------------------------------------------------------
      - name: Prepare python-for-android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          echo "===== python-for-android version ====="

          cd "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          git describe --tags --always || true


      # ---------------------------------------------------------
      # 8. Prepare local Python recipe patches
      #
      # IMPORTANT:
      # We use the official p4a Python recipe.
      # We only keep our custom disable_grp.patch in addition
      # to the official patches.
      # ---------------------------------------------------------
      - name: Prepare Python recipe patches
        run: |

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"

          echo "===== Paths ====="
          echo "P4A_DIR=$P4A_DIR"
          echo "LOCAL_PYTHON_RECIPE=$LOCAL_PYTHON_RECIPE"
          echo "P4A_PYTHON_RECIPE=$P4A_PYTHON_RECIPE"


          echo
          echo "===== Checking official Python recipe ====="

          test -f "$P4A_PYTHON_RECIPE/__init__.py"

          echo "Official Python recipe found."


          echo
          echo "===== Creating local Python recipe directory ====="

          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"


          echo
          echo "===== Copying official Python patches ====="

          cp \
            "$P4A_PYTHON_RECIPE/patches/"* \
            "$LOCAL_PYTHON_RECIPE/patches/"


          echo
          echo "===== Copying custom grp patch ====="

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          echo "disable_grp.patch found."


          echo
          echo "===== Adding disable_grp.patch to official recipe ====="

          python - <<'PY'
          from pathlib import Path

          p4a_recipe = Path(
              ".buildozer/android/platform/python-for-android/"
              "pythonforandroid/recipes/python3/__init__.py"
          )

          text = p4a_recipe.read_text()

          marker = "patches = ["

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find 'patches = [' in official "
                  "python3 recipe."
              )

          if "'patches/disable_grp.patch'" not in text:
              text = text.replace(
                  marker,
                  marker + "\n    'patches/disable_grp.patch',",
                  1
              )

          p4a_recipe.write_text(text)

          print("disable_grp.patch added to official p4a Python recipe.")
          PY


          echo
          echo "===== Verify official recipe patch list ====="

          sed -n '/patches = \[/,/^]/p' \
            "$P4A_PYTHON_RECIPE/__init__.py"


          echo
          echo "===== Verify custom patch ====="

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          echo "OK: disable_grp.patch exists."


          echo
          echo "===== Verify required official patches ====="

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1_fix_cortex_a8.patch"

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1.patch"

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/pyconfig_detection.patch"

          echo "OK: required official patches exist."


          echo
          echo "===== IMPORTANT: local __init__.py check ====="

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
              echo "ERROR: recipes/python3/__init__.py must NOT exist."
              exit 1
          fi

          echo "OK: local recipes/python3/__init__.py is absent."

      # ---------------------------------------------------------
      # 9. Verify required Python patches
      # ---------------------------------------------------------
      - name: Verify Python recipe
        run: |

          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          echo "===== Checking Python recipe ====="

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "ERROR: recipes/python3/__init__.py must NOT exist."
            exit 1
          fi

          echo "OK: local python3/__init__.py is absent."


          echo
          echo "===== Checking custom grp patch ====="

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          echo "OK: disable_grp.patch exists."


          echo
          echo "===== Checking official p4a patches ====="

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1_fix_cortex_a8.patch"

          echo "OK: py3.8.1_fix_cortex_a8.patch exists."


          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1.patch"

          echo "OK: py3.8.1.patch exists."


          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/pyconfig_detection.patch"

          echo "OK: pyconfig_detection.patch exists."


          echo
          echo "===== disable_grp.patch ====="

          cat \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"


      # ---------------------------------------------------------
      # 10. Verify libtool / libltdl
      #
      # This is specifically for the current libffi failure:
      #
      # configure.ac:215:
      # error: possibly undefined macro: LT_SYS_SYMBOL_USCORE
      # ---------------------------------------------------------
      
      # ---------------------------------------------------------
      # 11. Show important Buildozer configuration
      # ---------------------------------------------------------
      - name: Show Buildozer configuration
        run: |

          echo "===== buildozer.spec ====="

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' \
            buildozer.spec || true


          echo
          echo "===== Local recipes ====="

          find recipes \
            -maxdepth 3 \
            -type f \
            -print | sort


      # ---------------------------------------------------------
      # 12. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"

        run: |

          echo "===== Starting Buildozer ====="

          buildozer -v android debug


      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
