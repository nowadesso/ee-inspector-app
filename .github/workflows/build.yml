name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-sdl2-mirror-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-sdl2-mirror-${{ runner.os }}-

      - name: Locate and link sdkmanager
        run: |
          set -e
          SDK_DIR="/github/home/.buildozer/android/platform/android-sdk"
          echo "===== SDK directory contents ====="
          ls -la "$SDK_DIR"
          echo ""
          echo "===== Searching for sdkmanager ====="
          find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null
          echo ""
          echo "===== Searching for cmdline-tools directories ====="
          find "$SDK_DIR" -type d -name "cmdline-tools" 2>/dev/null
          echo ""
          # Try to create symlink from whatever we find
          FOUND=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            ln -sf "$FOUND" "$SDK_DIR/tools/bin/sdkmanager"
            echo "Symlinked sdkmanager from: $FOUND"
            ls -la "$SDK_DIR/tools/bin/"
          else
            echo "ERROR: sdkmanager still not found"
            exit 1
          fi

      - name: Pre-download SDL2
        run: |
          set -e
          PACKAGES_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/sdl2"
          mkdir -p "$PACKAGES_DIR"
          python3 -c "
          import urllib.request
          url = 'http://mirror.koddos.net/blfs/conglomeration/SDL/SDL2-2.28.5.tar.gz'
          out = '$PACKAGES_DIR/SDL2-2.28.5.tar.gz'
          print('Downloading', url)
          urllib.request.urlretrieve(url, out)
          import os
          print('Downloaded', os.path.getsize(out), 'bytes')
          "

      - name: Pre-download Android SDK command-line tools
        run: |
          set -e
          SDK_DIR="/github/home/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          python3 -c "
          import urllib.request
          import hashlib
          import os
          url = 'https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip'
          out = '$SDK_DIR/commandlinetools-linux-6514223_latest.zip'
          print('Downloading', url)
          urllib.request.urlretrieve(url, out)
          size = os.path.getsize(out)
          print('Downloaded', size, 'bytes')
          if size < 1000000:
              raise RuntimeError('Download too small, likely corrupted')
          "
          unzip -t "$SDK_DIR/commandlinetools-linux-6514223_latest.zip" > /dev/null
          echo "SDK tools downloaded and verified"

      - name: Build APK
        run: |
          set -e
          sed -i "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" buildozer.spec
          grep "p4a.local_recipes" buildozer.spec
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
