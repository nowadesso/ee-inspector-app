name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential \
            liblzma-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Python build tools
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-clean-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-clean-${{ runner.os }}-

      - name: Remove stale python-for-android
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

      - name: Prepare python-for-android
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"
          cd "$P4A_DIR"
          git describe --tags --always || true

      - name: Patch grpmodule.c source before CPython build
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          # This helper runs at recipe build time: it finds grpmodule.c in the
          # extracted CPython source tree and rewrites it to remove all
          # setgrent/getgrent/endgrent calls, which Android does not provide.
          cat > "$P4A_DIR/grp_fix_helper.py" <<'PYEOF'
          from pathlib import Path

          def patch_grpmodule(build_dir):
              grp = Path(build_dir) / "Modules" / "grpmodule.c"
              if not grp.is_file():
                  print("grpmodule.c not found at", grp)
                  return
              src = grp.read_text()

              # Replace the whole grp_getgrall_impl body with a version that
              # just returns an empty dict. This removes every reference to
              # setgrent/getgrent/endgrent.
              marker = "grp_getgrall_impl(PyObject *module)"
              idx = src.find(marker)
              if idx < 0:
                  print("grp_getgrall_impl not found; nothing to do")
                  return

              # Find the opening brace of the function body
              brace = src.find("{", idx)
              if brace < 0:
                  print("opening brace not found; nothing to do")
                  return

              # Find the matching closing brace by counting
              depth = 0
              end = -1
              for i in range(brace, len(src)):
                  c = src[i]
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  print("closing brace not found; nothing to do")
                  return

              replacement = (
                  "grp_getgrall_impl(PyObject *module)\n"
                  "{\n"
                  "    PyObject *d = PyDict_New();\n"
                  "    if (d == NULL)\n"
                  "        return NULL;\n"
                  "    return d;\n"
                  "}"
              )
              src = src[:idx] + replacement + src[end:]
              grp.write_text(src)
              print("patched grpmodule.c:", grp)

          if __name__ == "__main__":
              import sys
              patch_grpmodule(sys.argv[1])
          PYEOF

          echo "===== helper written ====="

          # Now hook the helper into the recipe's build_arch method.
          # We do this by appending a monkey-patch wrapper at the end of the
          # recipe module that overrides build_arch and calls the helper first.
          cat >> "$RECIPE" <<'PYRECIPE'

          # --- EE Inspector Pro grpmodule.c patch ---
          _ee_original_build_arch = Python3Recipe.build_arch

          def _ee_patched_build_arch(self, arch):
              import subprocess, sys
              from pathlib import Path
              build_dir = self.get_build_dir(arch.arch)
              helper = Path(
                  "/home/runner/work/ee-inspector-app/ee-inspector-app/"
                  ".buildozer/android/platform/python-for-android/"
                  "grp_fix_helper.py"
              )
              if helper.is_file():
                  try:
                      subprocess.check_call(
                          [sys.executable, str(helper), str(build_dir)]
                      )
                  except Exception as e:
                      print("grp patch helper failed:", e)
              return _ee_original_build_arch(self, arch)

          Python3Recipe.build_arch = _ee_patched_build_arch
          PYRECIPE

          echo "===== recipe patched ====="

          python -m py_compile "$RECIPE"
          echo "OK: recipe compiles."

          echo "===== showing the hook ====="
          tail -n 25 "$RECIPE"

      - name: Verify build configuration
        shell: bash
        run: |
          set -e
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' buildozer.spec || true
          find recipes -maxdepth 3 -type f -print | sort
          test -f .github/workflows/build.yml
          echo "OK: .github/workflows/build.yml exists."

      - name: Wipe buildozer state
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a"
          echo "wiped build-arm64-v8a"

      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
