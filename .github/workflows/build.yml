name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential \
            liblzma-dev 
    
          
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Python build tools
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-v5-${{ runner.os }}-

      - name: Remove stale python-for-android
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

      - name: Prepare python-for-android
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"
          cd "$P4A_DIR"
          git describe --tags --always || true

      - name: Patch python3 recipe
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          echo "===== appending patch hook ====="

          # Append a prebuild_arch hook that:
          #   1. Removes grp getgrent/setgrent/endgrent calls from grpmodule.c
          #   2. Disables readline and lzma modules in Modules/Setup
          cat >> "$RECIPE" <<'PATCH_EOF'

      
          # --- EE Inspector Pro grpmodule.c patch ---
          _ee_original_build_arch = Python3Recipe.build_arch

          def _ee_patched_prebuild_arch(self, arch):
               result = _ee_original_prebuild_arch(self, arch)
               import os
               from pathlib import Path

               build_dir = self.get_build_dir(arch.arch)

              # --- 1. Patch grpmodule.c to remove setgrent/getgrent/endgrent ---
              grp_file = Path(build_dir) / "Modules" / "grpmodule.c"
              if grp_file.is_file():
                 src = grp_file.read_text()
                 marker = "grp_getgrall_impl(PyObject *module)"
                 idx = src.find(marker)
                 if idx >= 0:
                    brace = src.find("{", idx)
                    if brace >= 0:
                        depth = 0
                        end = -1
                        for i in range(brace, len(src)):
                            c = src[i]
                            if c == "{":
                               depth += 1
                            elif c == "}":
                                depth -= 1
                            if depth == 0:
                                end = i + 1
                                break
                   if end > 0:
                      replacement = (
                         "grp_getgrall_impl(PyObject *module)\n"
                        "{\n"
                        "    PyObject *d = PyDict_New();\n"
                        "    if (d == NULL)\n"
                        "        return NULL;\n"
                        "    return d;\n"
                        "}"
                     )
                     src = src[:idx] + replacement + src[end:]
                     grp_file.write_text(src)
                     print("EE Inspector Pro: patched grpmodule.c")

                    # --- 2. Disable readline and lzma modules in Modules/Setup ---
                   setup = Path(build_dir) / "Modules" / "Setup"
                   if setup.is_file():
                      text = setup.read_text()
                      text = text.replace("readline readline.c", "*disabled*")
                      text = text.replace("lzma lzma.c", "*disabled*")
                      setup.write_text(text)
                      print("EE Inspector Pro: disabled readline and lzma modules")

          Python3Recipe.build_arch = _ee_patched_build_arch
          PATCH_EOF

          echo "===== recipe patched ====="

          python -m py_compile "$RECIPE"
          echo "OK: recipe compiles."

          echo "===== showing the hook ====="
          tail -n 50 "$RECIPE"
                
      - name: Disable readline module in CPython build
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          cat >> "$RECIPE" <<'PYRECIPE'

      - name: Verify build configuration
        shell: bash
        run: |
          set -e
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' buildozer.spec || true
          find recipes -maxdepth 3 -type f -print | sort
          test -f .github/workflows/build.yml
          echo "OK: .github/workflows/build.yml exists."

      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
