name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-sdl2-mirror-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-sdl2-mirror-${{ runner.os }}-

      - name: Pre-download Android SDK command-line tools
        run: |
          set -e
          SDK_DIR="/github/home/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          
          # Use the official Google URL directly
          curl -L -o commandlinetools-linux-6514223_latest.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip"
          
          # Verify the download is a valid zip
          unzip -t commandlinetools-linux-6514223_latest.zip > /dev/null
          echo "SDK tools downloaded and verified: $(ls -la commandlinetools-linux-6514223_latest.zip)"
          
      - name: Build APK
        run: |
          set -e
          sed -i "s|^p4a.local_recipes = .*|p4a.local_recipes = $GITHUB_WORKSPACE/recipes|" buildozer.spec
          grep "p4a.local_recipes" buildozer.spec
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
