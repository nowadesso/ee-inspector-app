name: "Build EE Inspector Pro APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev gettext autopoint curl wget patch build-essential

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Python build tools
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer "cython<3.4"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Remove stale python-for-android
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

      - name: Prepare python-for-android
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$GITHUB_WORKSPACE/.buildozer/android/platform"
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git "$P4A_DIR"
          cd "$P4A_DIR"
          git describe --tags --always || true

      - name: Prepare Python recipe
        shell: bash
        run: |
          set -e
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"
          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          test -f "$P4A_PYTHON_RECIPE/__init__.py"

          rm -f "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"
          rm -f "$P4A_PYTHON_RECIPE/patches/disable_grp.patch"

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "ERROR: recipes/python3/__init__.py must NOT exist."
            exit 1
          fi

          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"
          cp "$P4A_PYTHON_RECIPE/patches/"* "$LOCAL_PYTHON_RECIPE/patches/"

          echo "===== Installing CPython grp fixer ====="

          python -c "
          from pathlib import Path
          recipe = Path('$P4A_PYTHON_RECIPE/__init__.py')
          text = recipe.read_text()
          helper = '''

          # EE Inspector Pro: Android Python grp compatibility fix
          def _ee_inspector_fix_android_grp_source(recipe_build_dir):
              from pathlib import Path
              grp_file = Path(recipe_build_dir) / \"Modules\" / \"grpmodule.c\"
              if not grp_file.is_file():
                  raise RuntimeError(f\"grpmodule.c not found: {grp_file}\")
              source = grp_file.read_text()
              if \"setgrent();\" not in source:
                  return
              start = source.find(\"    setgrent();\")
              end = source.find(\"    return d;\", start)
              if start < 0 or end < 0:
                  raise RuntimeError(\"Could not locate grp enumeration block.\")
              source = source[:start] + source[end:]
              for name in (\"setgrent();\", \"getgrent();\", \"endgrent();\"):
                  if name in source:
                      raise RuntimeError(f\"grp source fix incomplete: {name}\")
              grp_file.write_text(source)
          '''
          recipe.write_text(text + helper)
          "

          echo "===== Adding grp fixer call ====="

          python -c "
          from pathlib import Path
          recipe = Path('$P4A_PYTHON_RECIPE/__init__.py')
          text = recipe.read_text()
          marker = '        recipe_build_dir = self.get_build_dir(arch.arch)'
          call = '        _ee_inspector_fix_android_grp_source(recipe_build_dir)'
          if marker not in text:
              raise SystemExit('ERROR: Could not find recipe_build_dir line.')
          if call not in text:
              text = text.replace(marker, marker + '\n' + call, 1)
          recipe.write_text(text)
          print('OK: grp fixer call inserted.')
          "

          python -m py_compile "$P4A_PYTHON_RECIPE/__init__.py"
          echo "OK: Python recipe syntax is valid.""

      - name: Verify build configuration
        shell: bash
        run: |
          set -e
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch|p4a.source_dir|p4a.local_recipes)' buildozer.spec || true
          find recipes -maxdepth 3 -type f -print | sort
          test -f .github/workflows/build.yml
          echo "OK: .github/workflows/build.yml exists."

      - name: Inspect Python recipe
        shell: bash
        run: |
          set -e
          P4A_PYTHON_RECIPE="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py"
          grep -n -A4 -B4 "_ee_inspector_fix_android_grp_source" "$P4A_PYTHON_RECIPE" || true

      - name: Build Android APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ee-inspector-pro-apk
          path: bin/*.apk
          if-no-files-found: error
