name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout project
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Python for Buildozer
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install Ubuntu dependencies
      # ------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            wget \
            patch \
            build-essential

      # ------------------------------------------------------------
      # 4. Install Buildozer / Cython
      # ------------------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            "buildozer" \
            "cython<3.4"

      # ------------------------------------------------------------
      # 5. Show project structure
      # ------------------------------------------------------------
      - name: Check project files
        run: |
          echo "===== Project root ====="
          find . -maxdepth 3 -type f | sort

          echo
          echo "===== Local Python recipe ====="
          if [ -d "recipes/python3" ]; then
            find recipes/python3 -maxdepth 3 -type f | sort
          else
            echo "ERROR: recipes/python3 does not exist"
            exit 1
          fi

      # ------------------------------------------------------------
      # 6. Verify custom OpenCV recipes
      # ------------------------------------------------------------
      - name: Verify OpenCV recipes
        run: |
          echo "Checking OpenCV recipe..."

          test -f recipes/opencv/__init__.py
          test -f recipes/opencv_extras/__init__.py

          echo "OpenCV recipe:"
          ls -la recipes/opencv

          echo
          echo "OpenCV Extras recipe:"
          ls -la recipes/opencv_extras

          echo
          echo "OpenCV recipes verified."

      # ------------------------------------------------------------
      # 7. Verify custom Python patch
      # ------------------------------------------------------------
      - name: Verify custom Python patch
        run: |
          echo "Checking custom disable_grp.patch..."

          test -f recipes/python3/patches/disable_grp.patch

          echo
          echo "Custom patch:"
          ls -lh recipes/python3/patches/disable_grp.patch

          echo
          echo "Patch contents:"
          cat recipes/python3/patches/disable_grp.patch

          echo
          echo "Custom Python patch verified."

      # ------------------------------------------------------------
      # 8. Cache Buildozer / p4a downloads
      # ------------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ------------------------------------------------------------
      # 9. Remove stale python-for-android checkout
      # ------------------------------------------------------------
      - name: Prepare python-for-android
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          echo "P4A directory:"
          echo "$P4A_DIR"

          if [ -d "$P4A_DIR" ]; then
            echo "Removing existing python-for-android..."
            rm -rf "$P4A_DIR"
          fi

          mkdir -p "$(dirname "$P4A_DIR")"

          echo
          echo "Cloning python-for-android v2026.05.09..."

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          echo
          echo "python-for-android commit:"
          git -C "$P4A_DIR" rev-parse HEAD

          echo
          echo "python-for-android version:"
          git -C "$P4A_DIR" describe --tags --always || true

      # ------------------------------------------------------------
      # 10. Copy official Python patches into local recipe
      # ------------------------------------------------------------
      - name: Prepare patched Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          P4A_PYTHON_RECIPE="$P4A_DIR/pythonforandroid/recipes/python3"

          echo "=============================================="
          echo "Preparing Python3 patches"
          echo "=============================================="

          echo
          echo "Official p4a Python recipe:"
          echo "$P4A_PYTHON_RECIPE"

          echo
          echo "Local Python recipe:"
          echo "$LOCAL_PYTHON_RECIPE"

          # --------------------------------------------------------
          # Verify official Python recipe
          # --------------------------------------------------------
          if [ ! -d "$P4A_PYTHON_RECIPE" ]; then
            echo "ERROR: Official p4a Python3 recipe not found!"
            exit 1
          fi

          if [ ! -f "$P4A_PYTHON_RECIPE/__init__.py" ]; then
            echo "ERROR: Official Python3 recipe __init__.py not found!"
            exit 1
          fi

          # --------------------------------------------------------
          # IMPORTANT:
          # We do NOT replace the official Python recipe.
          #
          # The local recipe directory exists because we need our
          # custom disable_grp.patch.
          #
          # Therefore copy ALL official patches locally.
          # --------------------------------------------------------

          mkdir -p "$LOCAL_PYTHON_RECIPE/patches"

          # Save our custom patch before copying official patches.
          if [ -f "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch" ]; then
            echo
            echo "Saving custom disable_grp.patch..."
            cp \
              "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch" \
              "$RUNNER_TEMP/disable_grp.patch"
          else
            echo "ERROR: disable_grp.patch is missing!"
            exit 1
          fi

          # --------------------------------------------------------
          # Copy ALL official p4a Python3 patches.
          # --------------------------------------------------------
          echo
          echo "Copying official p4a Python3 patches..."

          cp -v \
            "$P4A_PYTHON_RECIPE/patches/"* \
            "$LOCAL_PYTHON_RECIPE/patches/"

          # --------------------------------------------------------
          # Restore custom patch.
          # --------------------------------------------------------
          echo
          echo "Restoring custom disable_grp.patch..."

          cp -v \
            "$RUNNER_TEMP/disable_grp.patch" \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          # --------------------------------------------------------
          # Verify required patches.
          # --------------------------------------------------------
          echo
          echo "=============================================="
          echo "Final local Python3 patches"
          echo "=============================================="

          find "$LOCAL_PYTHON_RECIPE/patches" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "Checking required patches..."

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/disable_grp.patch"

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1_fix_cortex_a8.patch"

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/py3.8.1.patch"

          test -f \
            "$LOCAL_PYTHON_RECIPE/patches/pyconfig_detection.patch"

          echo
          echo "SUCCESS: Required Python patches are present."

      # ------------------------------------------------------------
      # 11. Show Python recipe patch configuration
      # ------------------------------------------------------------
      - name: Inspect Python recipe
        shell: bash
        run: |
          set -e

          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          LOCAL_PYTHON_RECIPE="$GITHUB_WORKSPACE/recipes/python3"

          echo "=============================================="
          echo "Official Python recipe"
          echo "=============================================="

          sed -n '1,240p' \
            "$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"

          echo
          echo "=============================================="
          echo "Local Python recipe"
          echo "=============================================="

          if [ -f "$LOCAL_PYTHON_RECIPE/__init__.py" ]; then
            echo "WARNING: Local recipes/python3/__init__.py exists."
            echo "It should normally remain deleted."
            ls -lh "$LOCAL_PYTHON_RECIPE/__init__.py"
          else
            echo "Good: local recipes/python3/__init__.py is absent."
          fi

          echo
          echo "=============================================="
          echo "Local Python patches"
          echo "=============================================="

          find "$LOCAL_PYTHON_RECIPE/patches" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ------------------------------------------------------------
      # 12. Build APK
      # ------------------------------------------------------------
      - name: Build Android APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          set -e

          echo "=============================================="
          echo "Starting Buildozer Android build"
          echo "=============================================="

          buildozer -v android debug

      # ------------------------------------------------------------
      # 13. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EE-Inspector-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
